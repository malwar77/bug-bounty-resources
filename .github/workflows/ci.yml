name: Markdown Quality & Link Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      quality_gate_categories:
        description: 'Comma-separated categories that FAIL the build'
        required: false
        default: 'BROKEN_NOT_FOUND,BROKEN_INTERNAL_FILE,TIMEOUT_OR_DNS_FAILURE,HTTP_5XX'
      warning_categories:
        description: 'Comma-separated categories that report warnings only'
        required: false
        default: 'REDIRECTED,BOT_PROTECTED_OR_AUTH'
      linkcheck_timeout:
        description: 'Request timeout in seconds'
        required: false
        default: '15'
      linkcheck_concurrency:
        description: 'Maximum concurrent requests'
        required: false
        default: '8'
      cache_dir:
        description: 'Path for lychee cache directory'
        required: false
        default: '.lycheecache'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QUALITY_GATE_CATEGORIES: ${{ github.event.inputs.quality_gate_categories || 'BROKEN_NOT_FOUND,BROKEN_INTERNAL_FILE,TIMEOUT_OR_DNS_FAILURE,HTTP_5XX' }}
  WARNING_CATEGORIES: ${{ github.event.inputs.warning_categories || 'REDIRECTED,BOT_PROTECTED_OR_AUTH' }}
  LINKCHECK_TIMEOUT: ${{ github.event.inputs.linkcheck_timeout || '15' }}
  LINKCHECK_CONCURRENCY: ${{ github.event.inputs.linkcheck_concurrency || '8' }}
  LINKCHECK_CACHE_DIR: ${{ github.event.inputs.cache_dir || '.lycheecache' }}

jobs:
  validate-and-test:
    name: Schema Validation & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate lychee.toml schema and values
        run: python3 scripts/validate_config.py lychee.toml

      - name: Run link-checker unit & regression test suite
        run: python3 -m unittest discover tests -v

  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache npm global tools
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-markdownlint-${{ hashFiles('**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-npm-markdownlint-

      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  link-check:
    name: Link Checking & Quality Gate
    needs: [validate-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LINKCHECK_CACHE_DIR }}
          key: ${{ runner.os }}-lychee-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lychee-

      - name: Run lychee link checker (reads lychee.toml)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --timeout ${{ env.LINKCHECK_TIMEOUT }}
            --max-concurrency ${{ env.LINKCHECK_CONCURRENCY }}
            --cache
            --max-cache-age 1d
            --cache-exclude-status '429,5..'
            --output lychee-report.md
            --format markdown
            "**/*.md"
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Quality gate, annotations & step summary
        run: |
          python3 scripts/check_links.py \
            --timeout "${{ env.LINKCHECK_TIMEOUT }}" \
            --concurrency "${{ env.LINKCHECK_CONCURRENCY }}" \
            --quality-gate "${{ env.QUALITY_GATE_CATEGORIES }}" \
            --warning-categories "${{ env.WARNING_CATEGORIES }}" | tee audit_output.txt
          GATE_STATUS="${PIPESTATUS[0]}"
          
          echo "### 🔗 Link Audit Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f lychee-report.md ]; then
            cat lychee-report.md >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Gate Fail Categories:** \`${{ env.QUALITY_GATE_CATEGORIES }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Warning Categories:** \`${{ env.WARNING_CATEGORIES }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Exit Status:** \`$GATE_STATUS\`" >> $GITHUB_STEP_SUMMARY
          exit "$GATE_STATUS"
