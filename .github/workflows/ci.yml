name: Markdown Quality & Link Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package*.json'

      - name: Cache npm global tools
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-markdownlint-${{ hashFiles('**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-npm-markdownlint-

      - name: Run markdownlint-cli2
        run: |
          npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  link-check:
    name: Link Checking & Annotations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: ${{ runner.os }}-lychee-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lychee-

      - name: Run lychee link checker with tuned timeouts
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --max-concurrency 8
            --timeout 15
            --cache
            --max-cache-age 1d
            --accept 200,204,401,403
            --exclude "^https://(twitter|x)\\.com"
            --exclude "^https://(www\\.)?linkedin\\.com"
            --exclude "^https://(www\\.)?youtube\\.com"
            --exclude "^https://medium\\.com"
            --exclude "^https://(www\\.)?amazon\\.com"
            --exclude "^https://amzn\\.to"
            --exclude "^https://web\\.archive\\.org"
            --output lychee-report.md
            --format markdown
            "**/*.md"
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PR Annotations & Step Summary
        run: |
          python3 scripts/check_links.py | tee audit_output.txt || true
          
          echo "### 🔗 Link & Markdown Audit Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f lychee-report.md ]; then
            cat lychee-report.md >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for errors in output and annotate PR
          while IFS= read -r line; do
            if [[ "$line" =~ ^::error ]]; then
              echo "$line"
            fi
          done < audit_output.txt
